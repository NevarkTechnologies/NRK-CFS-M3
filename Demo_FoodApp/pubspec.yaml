name: nevark_foods
description: Nevark's BenchBites is a food ordering app that connects students with local canteens. It offers a wide variety of cuisines, easy ordering, and reliable service.
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  lottie: ^2.7.0
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  fl_chart: ^1.2.0
  image_picker: ^1.2.2
  google_fonts: ^6.3.2
  http: ^1.6.0
  razorpay_flutter: ^1.3.0
  # Vendored (packages/paytm_allinonesdk): pub.dev 1.2.8 fails to compile on
  # Flutter 3.29+ (removed v1-embedding Registrar import) — see its README.
  paytm_allinonesdk:
    path: packages/paytm_allinonesdk
  qr_flutter: ^4.1.0
  shared_preferences: ^2.2.0
  # Firebase packages added here
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.1
  google_sign_in: ^6.2.0
  # Direct dep so login_page can import web_only.dart (renderButton) on web
  # without tripping depend_on_referenced_packages. Same version already
  # resolved transitively via google_sign_in.
  google_sign_in_web: ^0.12.4+4
  url_launcher: ^6.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^19.4.0
  csv: ^8.0.0
  file_picker: ^10.3.3
  path_provider: ^2.1.2
  excel: ^4.0.3 
  animated_text_kit: ^4.2.3
  web: ^1.1.1
  # Mandatory in-app update gate (Google Play In-App Updates). package_info_plus
  # reads the installed versionCode; in_app_update drives the immediate flow.
  in_app_update: ^4.2.3
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon3.png"

flutter:
  uses-material-design: true
  assets:
    - assets/cafes/
    - assets/
    # Only icon3 is used by the app (sign-in card, cafeteria header). The other
    # files in assets/icon/ exist solely as flutter_launcher_icons source art
    # and are never loaded at runtime, so they stay on disk but out of the
    # bundle — shipping the whole folder added ~6 MB to every build.
    - assets/icon/icon3.png
    - assets/Nevark_Logo.png
    - assets/Nevark.png
    
    
