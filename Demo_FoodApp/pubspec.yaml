name: nevark_foods
description: Nevark Foods is a food ordering app that connects students with local canteens. It offers a wide variety of cuisines, easy ordering, and reliable service.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  lottie: ^2.7.0
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  fl_chart: ^1.2.0
  image_picker: ^1.2.2
  google_fonts: ^6.3.2
  http: ^1.6.0
  razorpay_flutter: ^1.3.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.2.0
  # Firebase packages added here
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.1
  google_sign_in: ^6.2.0
  url_launcher: ^6.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^19.4.0
  csv: ^8.0.0
  file_picker: ^10.3.3
  path_provider: ^2.1.2
  excel: ^4.0.3 
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cafes/
    - assets/
    - assets/Nevark_Logo.png
    - assets/Nevark.png
    
    
